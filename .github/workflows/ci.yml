name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    # Backend Setup ve Test
    - name: Use Node.js for Backend
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'
        cache-dependency-path: './backend/package-lock.json'
        
    - name: Install Backend Dependencies
      run: |
        cd backend
        npm ci

    # Frontend Setup ve Build Testi
    - name: Use Node.js for Frontend
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'
        
    - name: Install Frontend Dependencies and Build
      run: |
        cd frontend
        npm ci
        npm run build

    # İlerleyen süreçte Docker build testleri veya Deployment adımları buraya eklenecektir.
